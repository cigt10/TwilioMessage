<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<div class="main-panel">
    <!-- View: Upload Excel File -->
    
    <div *ngIf="currentView === 'upload'">
        <h4 class="heading">Select Spreadsheet</h4>
    
        <div class="drop-area" (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
            [class.drag-over]="dragging">
    
            <img src="assets/excel-icon.png" class="icon" />
            <p>Drag an Excel Sheet file here or click the button below to upload.</p>
    
            <input type="file" (change)="onFileSelected($event)" hidden #fileInput accept=".xlsx, .xls" />
            <button mat-raised-button color="primary" (click)="fileInput.click()">Select File</button>
    
            <div class="file-size-info">Maximum file size: 5 MB</div>
            <div *ngIf="fileError" class="error-text">{{ fileError }}</div>
        </div>
    
        <div class="action-buttons">
            <button mat-stroked-button color="accent">Back</button>
        </div>
    </div>

    <!-- View: Select Sheet -->
    
    <div *ngIf="currentView === 'sheet'" class="spreadsheet-container">
        <h4 class="heading">Select Spreadsheet</h4>
    
        <!-- Uploaded File -->
        <div class="file-display">
            <div class="file-info">
                <img src="assets/excel-icon.svg" alt="Excel Icon" />
                <span>{{ fileName }}</span>
            </div>
            <button (click)="clearFile()" class="clear-btn">✕</button>
        </div>
    
        <!-- Select Sheet -->
        <div class="form-row">
            <label for="sheet">Select Sheet</label>
            <select id="sheet" [(ngModel)]="selectedSheet" (change)="onSheetSelect()">
                <option *ngFor="let sheet of sheetNames" [value]="sheet">{{ sheet }}</option>
            </select>
        </div>
    
        <!-- Select Rows -->
        <div class="form-row">
            <label>Select Rows</label>
            <div class="radio-group">
                <label><input type="radio" [(ngModel)]="rowOption" value="all" (change)="onRowOptionChange()" /> Send to
                    All</label>
                <label><input type="radio" [(ngModel)]="rowOption" value="selected" (change)="onRowOptionChange()" /> Send
                    to Selected</label>
            </div>
        </div>
        <!-- Row Range (visible only when "Send to Selected" is chosen) -->
        <div class="row-range" *ngIf="rowOption === 'selected'">
            <div class="form-row">
                <label for="startRow">Start Row</label>
                <input id="startRow" type="number" [(ngModel)]="startRow" (input)="updateRecipientCount()"
                    placeholder="Enter start row" />
            </div>
    
            <div class="form-row">
                <label for="endRow">End Row</label>
                <input id="endRow" type="number" [(ngModel)]="endRow" (input)="updateRecipientCount()"
                    placeholder="Enter end row" />
            </div>
        </div>
    
        <!-- Recipient Count -->
        <div *ngIf="selectedSheet" class="recipient-count" [ngStyle]="{ color: recipientCount === 0 ? 'red' : '#1976d2' }">
            {{ recipientCount }} Recipients selected
        </div>
    
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="back-btn" (click)="currentView = 'upload'">Back</button>
            <button class="next-btn" (click)="currentView = 'mapFields'">Next</button>
        </div>
    </div>
    
</div>
